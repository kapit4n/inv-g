name: Windows Installer

# Builds the NSIS installer on a real Windows runner.
#
# This must run on Windows. On Linux/macOS, `tauri build --bundles nsis` exits 0
# and produces *nothing* — no installer, no error — so a green build elsewhere
# does not mean a working installer exists. See docs/windows-installer.md.
#
# Manual run:  Actions → Windows Installer → Run workflow
#               → builds the installer and uploads it to the run's Artifacts.
#               → does NOT create a release; only a tag can do that.
# Release:     git push origin v1.0.0
#
# A GitHub Release is only ever created for a tag. A manual run on a branch used
# to reach the release step, where `softprops/action-gh-release` fell back to
# `github.ref` = `refs/heads/main` and failed with
# `400 {"message":"Missing tag_name parameter"}`. The release step is now gated on
# `github.ref_type == 'tag'` and passes `tag_name` explicitly, so that path is gone.
#
# QUALITY GATES LIVE IN ci.yml, NOT HERE.
#
# This workflow used to re-run typecheck, lint, the full frontend suite and the
# Rust test step — the same four things `ci.yml` already runs on every push and
# pull request. That doubled the cost of a release without testing anything the
# tagged commit had not already been tested for, and it is the reason a release
# took ~25 minutes. They are removed here, not from `ci.yml`: `ci.yml` remains the
# single place quality is enforced, and nothing about it was changed.
#
# What is left is deliberately only the path to a shippable artifact: validate the
# version, install, build, bundle, upload, release. `npm run tauri:build` is still
# what produces the installer, and it still compiles the full Rust production code
# and runs `tsc -b` via `beforeBuildCommand` — dropping the separate typecheck step
# removes a duplicate, not the check itself.
#
# The assumption this rests on: the tagged commit already passed `ci.yml`. Note
# that `ci.yml` triggers on `branches:`, not tags, so a tag push does not start a
# CI run of its own. That is fine in the normal flow — a tag is cut from a commit
# that is already green on `main` — but it does mean a tag on an untested commit
# would build an installer with no CI behind it. Tag green commits.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The build machine has no GPU or display; keep the webview headless.
  CI: true

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # Pinned deliberately. The action's `build-warnings` input defaults
          # to "deny" (it sets CARGO_BUILD_WARNINGS), so this is not a no-op:
          # it is recorded here on purpose so a future change to that default
          # cannot silently change how strict this pipeline is.
          build-warnings: "deny"
          components: clippy, rustfmt

      # `--ignore-scripts` is required, not an optimisation.
      #
      # `better-sqlite3` is a devDependency used only by the local seed tooling
      # (`database/seed/`). Neither the Vite build nor the Rust backend needs it
      # — the app's database is rusqlite, inside src-tauri. A plain `npm ci` tries
      # to compile it with node-gyp, which fails on the runner: node-gyp cannot
      # parse the installed Visual Studio 18 ("unknown version \"undefined\"
      # found at C:\Program Files\Microsoft Visual Studio\18\Enterprise"), so
      # `npm ci` dies before a single line of Rust is compiled.
      #
      # Verified locally: with --ignore-scripts the frontend build and all 461
      # Vitest tests pass, and the Tauri CLI still resolves. No postinstall is
      # needed for the packaging path.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify version sync
        run: npm run version:check

      # `version:check` proves every version file agrees with package.json, but
      # not that they agree with the tag being released. Without this,
      # `git tag v9.9.9` on a 1.0.0 tree publishes a release labelled 9.9.9 whose
      # installer says 1.0.0.
      #
      # The comparison lives in scripts/version.mjs so the release gate and
      # `npm run version:set` can never disagree about what a version is. It
      # strips the leading `v`, so v1.0.0-alpha.2 and 1.0.0-alpha.2 match, and it
      # accepts prereleases rather than only MAJOR.MINOR.PATCH. package.json
      # stays the single source of truth: the tag is checked against it, never
      # written to it.
      - name: Verify tag matches app version
        if: github.ref_type == 'tag'
        run: npm run version:tag -- "${{ github.ref_name }}"

      # The two cache steps below run *before* the build, which is the whole point
      # of them. They used to sit after the test steps: by then the Rust test step
      # had already compiled everything into `target/debug`, and because `tauri build`
      # compiles the `release` profile, that work was in a directory the
      # production build never reads. The cache was saved and restored for a
      # profile the installer did not use, and the build still started cold.
      #
      # Caching `target` cannot hand back a stale *binary*: Cargo fingerprints
      # every unit on its inputs and its own profile, and recompiles whatever does
      # not match. A mismatched cache therefore costs restore time, never
      # correctness. The rustc version is in the key so a toolchain bump starts a
      # new entry instead of repeatedly restoring artifacts it must discard.
      - name: Resolve Rust version for the cache key
        shell: pwsh
        run: |
          $v = (rustc --version) -replace '\s+', '-'
          "RUSTC=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Rust toolchain: $v"

      # Crate sources rather than build output. Keyed on Cargo.lock so a dependency
      # change gets a fresh entry; the restore-keys prefix still lets an unchanged
      # dependency graph skip the downloads entirely. Cargo verifies checksums on
      # unpack, so a partially stale cache is corrected rather than trusted.
      - name: Restore Cargo registry cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-nsis-${{ env.RUSTC }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-nsis-${{ env.RUSTC }}-

      # Windows Defender quarantines freshly-built unsigned Rust binaries and
      # can corrupt or stall the NSIS build, producing a broken installer that
      # looks fine. Excluding the build tree is the documented mitigation.
      #
      # This step is now placed *after* the caches and `npm ci` on purpose. It
      # guards each path with `Test-Path`, and at its original position — before
      # either directory existed — both guards failed, so the exclusion that is
      # supposed to protect the build was silently never applied. It runs here so
      # the directories it names are real before Cargo starts writing into them.
      - name: Exclude build tree from Windows Defender
        shell: pwsh
        run: |
          $paths = @(
            "$env:GITHUB_WORKSPACE\src-tauri\target",
            "$env:GITHUB_WORKSPACE\node_modules"
          )
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Add-MpPreference -ExclusionPath $p
              Write-Host "Excluded from Defender: $p"
            } else {
              Write-Host "NOT excluded (path does not exist yet): $p"
            }
          }

      - name: Build NSIS installer
        run: npx tauri build --bundles nsis

      # The bundler names the output from `productName` + version. Rename it to
      # a stable, predictable asset name so release download links and the docs
      # can reference one path regardless of bundler naming changes.
      - name: Normalize installer name
        shell: pwsh
        run: |
          $bundle = "src-tauri\target\release\bundle\nsis"
          if (-not (Test-Path $bundle)) {
            Write-Error "No NSIS bundle directory at $bundle — the build produced no installer."
            exit 1
          }
          $installer = Get-ChildItem -Path $bundle -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            Write-Error "No .exe found in $bundle — the NSIS bundle did not produce an installer."
            exit 1
          }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $target = "src-tauri\target\release\bundle\nsis\InventoryGear-$version-setup.exe"
          Move-Item -Path $installer.FullName -Destination $target -Force
          Write-Host "Installer: $target"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          # Forward slashes on purpose: this is consumed as a glob by
          # upload-artifact and action-gh-release, and PowerShell's `\` separators
          # do not match reliably. Defined once so the artifact upload and the
          # release cannot drift onto different paths.
          "INSTALLER_ASSET=src-tauri/target/release/bundle/nsis/InventoryGear-$version-setup.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Prints exactly what the bundler produced, so a missing or renamed
      # installer is visible in the log instead of only as a later upload error.
      - name: List generated installers
        shell: bash
        run: |
          echo "Bundle contents:"
          find src-tauri/target/release/bundle -type f || true
          echo
          echo "Normalized installer:"
          ls -l "${INSTALLER_ASSET}"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: InventoryGear-${{ env.VERSION }}-windows-installer
          path: ${{ env.INSTALLER_ASSET }}
          if-no-files-found: error
          retention-days: 30

      # Signing is Windows-only and requires a certificate. Until a code-signing
      # certificate is configured, release builds are unsigned and SmartScreen
      # will warn on first run. See docs/windows-installer.md#code-signing.
      #
      # `ref_type == 'tag'` is the guard that matters: a manual run on a branch has
      # no tag, and without this the action defaults `tag_name` to `github.ref`
      # (`refs/heads/main`) and fails with `400 Missing tag_name parameter`.
      # Re-running a failed tag run is safe — the action updates the release that
      # already exists for the tag rather than creating a second one.
      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.INSTALLER_ASSET }}
          # Left as a draft on purpose: the release is reviewed and published by
          # hand, per the checklist in docs/windows-installer.md.
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
