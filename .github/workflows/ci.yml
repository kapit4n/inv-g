name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # Pinned deliberately. The action's `build-warnings` input defaults
          # to "deny" (it sets CARGO_BUILD_WARNINGS), so this is not a no-op:
          # it is recorded here on purpose so a future change to that default
          # cannot silently change how strict this pipeline is.
          build-warnings: "deny"
      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit & Integration Tests
        run: npx vitest run --reporter=verbose

      - name: Coverage
        run: npx vitest run --coverage --reporter=verbose

      - name: Rust Tests
        run: cd src-tauri && cargo test

      - name: Build
        run: npm run build

  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        working-directory: scripts/screenshots
        run: npx playwright install chromium

      - name: Generate screenshots
        working-directory: scripts/screenshots
        run: npx tsx generate_all.ts
        env:
          CI: true
