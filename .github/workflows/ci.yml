name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # Pinned deliberately. The action's `build-warnings` input defaults
          # to "deny" (it sets CARGO_BUILD_WARNINGS), so this is not a no-op:
          # it is recorded here on purpose so a future change to that default
          # cannot silently change how strict this pipeline is.
          build-warnings: "deny"
      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit & Integration Tests
        run: npx vitest run --reporter=verbose

      - name: Coverage
        run: npx vitest run --coverage --reporter=verbose

      - name: Rust Tests
        run: cd src-tauri && cargo test

      - name: Build
        run: npm run build

  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # `scripts/screenshots` is a separate npm package (own package.json and
      # lockfile) and the root project declares no `workspaces`, so the root
      # `npm ci` above does not install it. Without this step
      # `npx playwright install` resolves `playwright` from the npx cache and
      # never populates scripts/screenshots/node_modules, so the config's
      # `import { defineConfig } from "@playwright/test"` dies with
      # ERR_MODULE_NOT_FOUND.
      - name: Install screenshot dependencies
        working-directory: scripts/screenshots
        run: npm ci

      # --with-deps installs the system libraries Chromium needs, which
      # ubuntu-latest does not ship. Without it the browser can fail to launch
      # even though Playwright itself installed fine.
      - name: Install Chromium
        working-directory: scripts/screenshots
        run: npx playwright install --with-deps chromium

      - name: Generate screenshots
        working-directory: scripts/screenshots
        run: npx tsx generate_all.ts
        env:
          CI: true
